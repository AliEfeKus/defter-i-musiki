<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Eser (Nota) Arşivi | Defter-i Mûsıkî</title>
  <meta name="description" content="Defter-i Mûsıkî eser ve nota arşivi">
  <link rel="icon" href="/icon.png">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--bordo:#641b24;--bordo2:#4d141b;--krem:#f3eadb;--kagit:#fffaf0;--altin:#b89a66;--yazi:#2f2020;--soluk:#746763;--cizgi:#d7c7ae}
    *{box-sizing:border-box} body{margin:0;background:var(--krem);color:var(--yazi);font-family:Georgia,"Times New Roman",serif} a{color:inherit}
    .wrap{width:min(1220px,calc(100% - 30px));margin:auto} header{background:var(--bordo2);color:white;border-bottom:4px solid var(--altin)} .head{padding:20px 0}
    .head h1{margin:0;font-size:clamp(30px,5vw,48px);font-weight:normal}.head p{margin:5px 0 13px;opacity:.85}.home{color:white;text-decoration:none}
    main{padding:28px 0 50px}.panel{background:var(--kagit);border:1px solid var(--cizgi);padding:20px;box-shadow:0 5px 18px #0000000d}
    h2{margin:0 0 18px;color:var(--bordo);font-weight:normal;font-size:29px}.controls{display:grid;grid-template-columns:2fr repeat(5,1fr);gap:10px}
    input,select{width:100%;min-width:0;padding:11px 12px;border:1px solid #cdbca4;background:white;color:var(--yazi);font:inherit}
    .status{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:16px 0;color:var(--soluk)}.table-wrap{overflow:auto;border:1px solid var(--cizgi)}
    table{width:100%;border-collapse:collapse;background:white;min-width:960px}th,td{text-align:left;padding:11px 10px;border-bottom:1px solid #eee4d5;vertical-align:top}
    th{background:#eadbc5;color:#4c2226;position:sticky;top:0;z-index:1}tbody tr:hover{background:#fff8eb}.eser{font-weight:bold;min-width:240px}
    .pdfs a,.source{color:var(--bordo);display:inline-block;margin-right:8px}.empty{text-align:center;padding:32px;color:var(--soluk)}
    .pagination{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:18px}button{border:0;background:var(--bordo);color:white;padding:10px 15px;font:inherit;cursor:pointer}button:disabled{opacity:.4;cursor:default}
    @media(max-width:900px){.controls{grid-template-columns:1fr 1fr}.controls input{grid-column:1/-1}}@media(max-width:560px){.controls{grid-template-columns:1fr}.controls input{grid-column:auto}.status{display:block}.status span{display:block;margin:5px 0}}
  </style>
</head>
<body>
<header><div class="wrap head"><h1>Defter-i Mûsıkî</h1><p>Eser (Nota) Arşivi</p><a class="home" href="/">← Ana Sayfa</a></div></header>
<main class="wrap"><section class="panel"><h2>Eser Arşivi</h2>
  <div class="controls">
    <input id="q" type="search" placeholder="Eser, bestekâr veya güfte sahibi ara…">
    <select id="bestekar"><option value="">Tüm bestekârlar</option></select>
    <select id="guftekar"><option value="">Tüm güftekârlar</option></select>
    <select id="makam"><option value="">Tüm makamlar</option></select>
    <select id="form"><option value="">Tüm formlar</option></select>
    <select id="usul"><option value="">Tüm usûller</option></select>
  </div>
  <div class="status"><span id="count">Arşiv yükleniyor…</span><span>Sayfa başına 50 eser</span></div>
  <div class="table-wrap"><table><thead><tr><th>Eser</th><th>Bestekâr</th><th>Güftekâr</th><th>Makam</th><th>Form</th><th>Usûl</th></tr></thead>
    <tbody id="rows"><tr><td colspan="6" class="empty">Yükleniyor…</td></tr></tbody></table></div>
  <div class="pagination"><button id="prev">← Önceki</button><span id="page"></span><button id="next">Sonraki →</button></div>
</section></main>
<script>
const SUPABASE_URL="https://mdudrzlathbtbqschnmu.supabase.co";
const SUPABASE_KEY="sb_publishable_017pwWESopoIzZaXV9WwdA_lGB9m3hV";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const PAGE_SIZE=50, BASE="/arsiv/";
let currentPage=1,totalCount=0,timer=null;
const $=id=>document.getElementById(id);
const esc=s=>(s??"").toString().replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));
const safeUrl=u=>(typeof u==="string"&&/^https?:\/\//i.test(u))?u:"#";

async function getFilterValues(viewName){
  const tumu=[];
  const parca=1000;

  for(let baslangic=0;;baslangic+=parca){
    const {data,error}=await db
      .from(viewName)
      .select("ad")
      .order("ad",{ascending:true})
      .range(baslangic,baslangic+parca-1);

    if(error) throw error;

    tumu.push(...(data||[]));

    if(!data || data.length<parca) break;
  }

  return tumu.map(x=>x.ad).filter(Boolean);
}
function fillSelect(id,values){const s=$(id),frag=document.createDocumentFragment();[...new Set(Array.isArray(values)?values:[])].filter(v=>v!==null&&v!==undefined&&v!=="").sort((a,b)=>String(a).localeCompare(String(b),"tr")).forEach(v=>{const o=document.createElement("option");o.value=v;o.textContent=v;frag.appendChild(o)});s.appendChild(frag);}
function temizAramaMetni(s){return(s??"").trim().replaceAll(","," ").replaceAll("("," ").replaceAll(")"," ");}

async function eserleriGetir(){
  $("rows").innerHTML='<tr><td colspan="6" class="empty">Yükleniyor…</td></tr>';
  const start=(currentPage-1)*PAGE_SIZE,end=start+PAGE_SIZE-1;
  let query=db.from("eserler").select("id,slug,eser,bestekar,gufte_sahibi,makam,form,usul",{count:"exact"});
  const q=temizAramaMetni($("q").value),b=$("bestekar").value,g=$("guftekar").value,m=$("makam").value,f=$("form").value,u=$("usul").value;
  if(q)query=query.or([`eser.ilike.%${q}%`,`bestekar.ilike.%${q}%`,`gufte_sahibi.ilike.%${q}%`,`makam.ilike.%${q}%`,`usul.ilike.%${q}%`,`form.ilike.%${q}%`].join(","));
  if(b)query=query.eq("bestekar",b); if(g)query=query.eq("gufte_sahibi",g); if(m)query=query.eq("makam",m); if(f)query=query.eq("form",f); if(u)query=query.eq("usul",u);
  const {data,error,count}=await query.order("id",{ascending:true}).range(start,end);
  if(error){console.error(error);$("count").textContent="Arşiv yüklenemedi.";$("page").textContent="";$("prev").disabled=true;$("next").disabled=true;$("rows").innerHTML='<tr><td colspan="6" class="empty">'+esc(error.message)+'</td></tr>';return;}
  totalCount=count??0; const totalPages=Math.max(1,Math.ceil(totalCount/PAGE_SIZE));
  if(currentPage>totalPages){currentPage=totalPages;return eserleriGetir();}
  $("count").textContent=totalCount.toLocaleString("tr-TR")+" eser bulundu"; $("page").textContent=currentPage+" / "+totalPages; $("prev").disabled=currentPage<=1; $("next").disabled=currentPage>=totalPages;
  if(!data||data.length===0){$("rows").innerHTML='<tr><td colspan="6" class="empty">Aramanıza uygun eser bulunamadı.</td></tr>';return;}
  $("rows").innerHTML=data.map(w=>{
    return '<tr><td class="eser">'+esc(w.eser)+'</td><td>'+esc(w.bestekar)+'</td><td>'+esc(w.gufte_sahibi)+'</td><td>'+esc(w.makam)+'</td><td>'+esc(w.form)+'</td><td>'+esc(w.usul)+'</td></tr>';
  }).join("");
}
function filtreleriUygula(){currentPage=1;eserleriGetir();}
$("q").addEventListener("input",()=>{clearTimeout(timer);timer=setTimeout(filtreleriUygula,350)});
["bestekar","guftekar","makam","form","usul"].forEach(id=>$(id).addEventListener("change",filtreleriUygula));
$("prev").onclick=()=>{if(currentPage>1){currentPage--;eserleriGetir();window.scrollTo({top:0,behavior:"smooth"});}};
$("next").onclick=()=>{const totalPages=Math.max(1,Math.ceil(totalCount/PAGE_SIZE));if(currentPage<totalPages){currentPage++;eserleriGetir();window.scrollTo({top:0,behavior:"smooth"});}};
(async()=>{
  try{
    const[b,g,m,f,u]=await Promise.all([
      getFilterValues("filtre_bestekarlar"),
      getFilterValues("filtre_guftekarlar"),
      getFilterValues("filtre_makamlar"),
      getFilterValues("filtre_formlar"),
      getFilterValues("filtre_usuller")
    ]);
    fillSelect("bestekar",b);
    fillSelect("guftekar",g);
    fillSelect("makam",m);
    fillSelect("form",f);
    fillSelect("usul",u);
  }catch(err){
    console.warn("Canlı filtre listeleri yüklenemedi:",err);
  }
  await eserleriGetir();
})();
</script>
</body>
</html>
